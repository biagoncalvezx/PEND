<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NewsToday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">

        <h1>NewsToday</h1>

        <p>Notícias do mundo em um só lugar</p>

        <nav class="menu">

            <a href="#" id="inicio">Início</a>

            <a href="#" id="tecnologia">Tecnologia</a>

            <a href="#" id="esportes">Esportes</a>

            <a href="#" id="economia">Economia</a>

            <a href="#" id="moda">Moda</a>

        </nav>


        <div class="pesquisa">

            <input
                type="text"
                id="campoPesquisa"
                placeholder="Pesquisar notícia..."
            >

            <button id="botaoBuscar">
                Pesquisar
            </button>

        </div>

    </header>


    <main class="conteudo">

        <div class="botoes">

            <button id="botaoLocalizacao">
                📍 Minha localização
            </button>

            <button id="botaoFavoritos">
                ⭐ Ver favoritos
            </button>

        </div>


        <p id="localizacao"></p>


        <h2 class="titulo">
            Notícias em destaque
        </h2>


        <section id="resultado">

            <p>Carregando notícias...</p>

        </section>

    </main>


    <footer class="rodape">

        <p>NewsToday © 2026</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
