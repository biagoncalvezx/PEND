<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Daily Routine</title>

    <link rel="stylesheet" href="atividade.css">
</head>

<body>

    <header>
        <h1>💌 My Daily Routine 💌</h1>
        <p>Arraste suas atividades para organizar seu dia!</p>
    </header>

    <div class="container">

        <div id="atividades">

            <h2>Principais Atividades ♡</h2>

            <div class="atividade" id="academia" draggable="true">
                🩷 Academia
            </div>

            <div class="atividade" id="trabalho" draggable="true">
                💻 Trabalho
            </div>

            <div class="atividade" id="leitura" draggable="true">
                📖 Leitura
            </div>

            <div class="atividade" id="estudo" draggable="true">
                ✍️ Estudos
            </div>

        </div>

        <div id="rotina">

            <h2>Minha Rotina ♡</h2>

            <div class="horario" id="horario08">
                <strong>08:00</strong>
            </div>

            <div class="horario" id="horario10">
                <strong>10:00</strong>
            </div>

            <div class="horario" id="horario12">
                <strong>12:00</strong>
            </div>

            <div class="horario" id="horario14">
                <strong>14:00</strong>
            </div>

            <div class="horario" id="horario16">
                <strong>16:00</strong>
            </div>

            <div class="horario" id="horario18">
                <strong>18:00</strong>
            </div>

        </div>

    </div>

    <div id="mensagem"></div>

    <script src="atividade.js"></script>

</body>

</html>
